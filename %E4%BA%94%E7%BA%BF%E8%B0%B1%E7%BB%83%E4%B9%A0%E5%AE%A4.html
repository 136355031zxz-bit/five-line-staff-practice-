<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f4ed">
<title>五线谱练习室</title>
<style>
:root{--bg:#f7f4ed;--card:#fffdf8;--ink:#20272b;--muted:#6c777a;--accent:#287d72;--good:#18815b;--bad:#c44d43;--line:#d9dfd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 15px 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}.title{font-size:clamp(27px,7vw,38px);font-weight:850;letter-spacing:-1px;margin:5px 0}.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.pill{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #253b3010}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.label{font-size:13px;color:var(--muted);font-weight:700}.score{font-size:14px;font-weight:800}.staffwrap{margin:12px -2px 0}.staff{width:100%;height:auto;display:block;touch-action:manipulation}.prompt{text-align:center;margin:4px 0 2px;font-size:17px;font-weight:800}.hint{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--ink)}.control.active{background:#e2f1eb;border-color:#91c5b4;color:#155d50}
.piano{display:flex;width:100%;height:170px;position:relative;user-select:none;touch-action:manipulation;margin-top:13px}.key{position:relative;flex:1;min-width:0;border:1px solid #b7bfba;border-radius:0 0 8px 8px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:11px;color:#65706c;font-weight:700}.key:first-child{border-radius:0 0 0 8px}.key:last-child{border-radius:0 0 8px 0}.key.black{position:absolute;z-index:2;top:0;height:62%;width:8%;background:#26312f;border:1px solid #101817;border-radius:0 0 5px 5px;color:#fff;padding-bottom:7px;box-shadow:0 3px 3px #0002}.key.selected{background:#d5f0e5!important;border-color:var(--accent);color:#125e50}.key.black.selected{background:#287d72!important;color:white}
.feedback{font-size:15px;font-weight:800;text-align:center;min-height:26px;padding:7px 0 0}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{background:var(--accent);color:white;border:0;border-radius:13px;padding:12px 17px;font:inherit;font-weight:800}.secondary{background:#edf0ea;color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font:inherit;font-weight:750}
.footer{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#f2f3ed;border-radius:13px;padding:10px;text-align:center}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
@media(max-width:430px){main{padding:17px 11px 25px}.card{padding:14px;border-radius:18px}.piano{height:150px}.key{font-size:10px}.key.black{width:8.4%}}
</style>
</head>
<body>
<main>
 <div class="top"><div><div class="eyebrow">NOTE READING · DAILY PRACTICE</div><h1 class="title">五线谱练习室</h1></div><span class="pill" id="modeTag">高音谱号</span></div>
 <p class="sub">看音符 · 找琴键 · 练出你的读谱直觉</p>
 <section class="card">
  <div class="row"><span class="label" id="roundLabel">第 1 题 · 找出对应琴键</span><span class="score">得分 <span id="score">0</span></span></div>
  <div class="staffwrap"><svg id="staff" class="staff" viewBox="0 0 340 180" role="img" aria-label="五线谱音符"></svg></div>
  <div class="prompt" id="question">这个音符对应哪个琴键？</div><div class="hint" id="rangeHint">范围：中央 C 到高音 C</div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="row" style="margin-top:8px"><button class="secondary" id="hearBtn">♫ 播放参考音</button><button class="primary" id="nextBtn">下一题 →</button></div>
 </section>
 <section class="card">
  <div class="row"><strong>选择琴键</strong><span class="label">点击下方键盘作答</span></div>
  <div class="piano" id="piano" aria-label="钢琴键盘"></div>
  <div class="row" style="margin-top:14px"><span class="label">练习范围</span><div class="controls"><button class="control active" data-range="treble">高音谱号</button><button class="control" data-range="bass">低音谱号</button><button class="control" data-range="both">混合练习</button></div></div>
  <div class="row" style="margin-top:12px"><span class="label">显示提示</span><div class="controls"><button class="control active" id="letterToggle">显示音名</button><button class="control" id="staffToggle">辅助线：开</button></div></div>
 </section>
 <section class="card">
  <div class="row"><strong>练习统计</strong><button class="secondary" id="resetBtn">重新开始</button></div>
  <div class="stats"><div class="stat"><strong id="total">0</strong><span>已答题</span></div><div class="stat"><strong id="accuracy">—</strong><span>正确率</span></div><div class="stat"><strong id="streak">0</strong><span>连续答对</span></div></div>
 </section>
 <p class="footer">无需注册 · 无需联网 · 适合手机练习<br>小提示：五线谱的线和间，都是一个音级的距离。</p>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
const names=['C','D','E','F','G','A','B'];
const semis=[0,2,4,5,7,9,11];
let range='treble',showLetters=true,ledger=true,target=60,clef='treble',score=0,total=0,correct=0,streak=0,best=0,answered=false;
const midiName=m=>names[((m-12)%12+12)%12]+(Math.floor(m/12)-1);
const naturalMidi=(letter,oct)=>12*(oct+1)+semis[names.indexOf(letter)];
function notePool(){let a=[];for(let m=48;m<=72;m++){let n=midiName(m);if(!n.includes('#'))a.push(m)}return a}
function choose(){let pool=notePool();target=pool[Math.floor(Math.random()*pool.length)];clef=range==='both'?(Math.random()<.5?'treble':'bass'):range;answered=false;$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').textContent='跳过 / 下一题 →';renderStaff();$('roundLabel').textContent=`第 ${total+1} 题 · 找出对应琴键`;renderPiano();$('question').textContent='这个音符对应哪个琴键？';$('rangeHint').textContent=clef==='treble'?'高音谱号 · 中央 C 至高音 C':'低音谱号 · 中央 C 附近';}
function renderStaff(){
 const svg=$('staff');svg.innerHTML='';const ns='http://www.w3.org/2000/svg';
 function el(tag,attrs,txt){let e=document.createElementNS(ns,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e}
 const y0=clef==='treble'?120:76,step=10;for(let i=0;i<5;i++)el('line',{x1:22,y1:y0-i*step,x2:318,y2:y0-i*step,stroke:'#48534f','stroke-width':1.25});
 el('text',{x:29,y:clef==='treble'?100:100,'font-size':clef==='treble'?58:48,fill:'#287d72','font-family':'serif'},clef==='treble'?'𝄞':'𝄢');
 el('text',{x:305,y:25,'font-size':10,fill:'#87918b','text-anchor':'end'},'音符');
 // diatonic index: C4=0, D4=1...
 const diatonic=m=>{let n=midiName(m),l=n[0],oct=Number(n.slice(1));return (oct-4)*7+names.indexOf(l)};
 const d=diatonic(target);
 // treble bottom line E4 (index 2), bass bottom line G2 (index -? use C4=14)
 const base=clef==='treble'?2:-12; // bass bottom line G2 = C4 index -? G2 = -? C4 to G2 is -9 diatonic steps
 const actualBase=clef==='treble'?2:-9;
 const y=y0-(d-actualBase)*step/2;
 if(ledger){for(let yy=y0+step;yy<y+2;yy+=step)el('line',{x1:150,y1:yy,x2:190,y2:yy,stroke:'#48534f','stroke-width':1});for(let yy=y0-5*step;yy>y-2;yy-=step)el('line',{x1:150,y1:yy,x2:190,y2:yy,stroke:'#48534f','stroke-width':1});}
 // correct bass reference bottom line G2: index C4=14; G2 index -? (2-4)*7+4=-10. use -10
 const fixedBase=clef==='treble'?2:-10;
 const yy=y0-(d-fixedBase)*step/2;
 el('ellipse',{cx:170,cy:yy,rx:8,ry:5.5,fill:'#20272b',transform:`rotate(-18 170 ${yy})`});
 el('line',{x1:177,y1:yy,x2:177,y2:yy-37,stroke:'#20272b','stroke-width':2});
 if(showLetters)el('text',{x:170,y:164,'font-size':17,'font-weight':800,fill:'#287d72','text-anchor':'middle'},midiName(target));
 else el('text',{x:170,y:164,'font-size':12,fill:'#7b8580','text-anchor':'middle'},'？');
}
const whiteNotes=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72];
function renderPiano(){let p=$('piano');p.innerHTML='';whiteNotes.forEach(m=>{let b=document.createElement('button');b.className='key';b.dataset.note=m;b.innerHTML=showLetters?midiName(m):' ';b.setAttribute('aria-label',midiName(m));b.onclick=()=>answer(m);p.appendChild(b)});
 const black=[49,51,54,56,58,61,63,66,68,70];black.forEach(m=>{let prev=whiteNotes.filter(n=>n<m).length-1;let b=document.createElement('button');b.className='key black';b.dataset.note=m;b.style.left=`calc(${(prev+1)*100/15}% - 4%)`;b.innerHTML=showLetters?midiName(m):'';b.setAttribute('aria-label',midiName(m));b.onclick=()=>answer(m);p.appendChild(b)});}
function answer(m){if(answered)return;answered=true;total++;let ok=m===target;if(ok){score+=10;correct++;streak++;best=Math.max(best,streak);$('feedback').textContent='答对了！+10 分';$('feedback').className='feedback good'}else{streak=0;$('feedback').textContent=`再看看：正确答案是 ${midiName(target)}`;$('feedback').className='feedback bad'}
document.querySelectorAll('.key').forEach(k=>{if(Number(k.dataset.note)===target)k.classList.add('selected')});$('score').textContent=score;$('total').textContent=total;$('accuracy').textContent=Math.round(correct/total*100)+'%';$('streak').textContent=streak;$('roundLabel').textContent=`第 ${total} 题 · ${ok?'回答正确':'继续加油'}`;$('nextBtn').textContent='下一题 →';playNote(target);}
function playNote(m){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=new AC(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.7);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.72);o.onended=()=>c.close()}catch(e){}}
$('nextBtn').onclick=choose;$('hearBtn').onclick=()=>playNote(target);
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));$('modeTag').textContent=range==='both'?'混合练习':range==='bass'?'低音谱号':'高音谱号';choose()});
$('letterToggle').onclick=()=>{showLetters=!showLetters;$('letterToggle').textContent=showLetters?'显示音名':'隐藏音名';$('letterToggle').classList.toggle('active',showLetters);renderStaff();renderPiano()};
$('staffToggle').onclick=()=>{ledger=!ledger;$('staffToggle').textContent='辅助线：'+(ledger?'开':'关');$('staffToggle').classList.toggle('active',ledger);renderStaff()};
$('resetBtn').onclick=()=>{score=total=correct=streak=best=0;$('score').textContent='0';$('total').textContent='0';$('accuracy').textContent='—';$('streak').textContent='0';choose()};
choose();
})();
</script>
</body></html>
