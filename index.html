<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f4ed">
<title>五线谱练习室</title>
<style>
:root{--bg:#f7f4ed;--card:#fffdf8;--ink:#20272b;--muted:#6c777a;--accent:#287d72;--good:#18815b;--bad:#c44d43;--line:#d9dfd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 15px 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:800}.title{font-size:clamp(27px,7vw,38px);font-weight:850;letter-spacing:-1px;margin:5px 0}.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.pill{border:1px solid var(--line);background:#fffdf8;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #253b3010}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.label{font-size:13px;color:var(--muted);font-weight:700}.score{font-size:14px;font-weight:800}.staffwrap{margin:12px -2px 0}.staff{width:100%;height:auto;display:block;touch-action:manipulation}.prompt{text-align:center;margin:4px 0 2px;font-size:17px;font-weight:800}.hint{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;font-weight:700;color:var(--ink)}.control.active{background:#e2f1eb;border-color:#91c5b4;color:#155d50}
.piano{display:flex;width:100%;height:170px;min-height:170px;position:relative;user-select:none;touch-action:manipulation;margin-top:13px}.key{appearance:none;-webkit-appearance:none;position:relative;flex:1;min-width:0;border:1px solid #b7bfba;border-radius:0 0 8px 8px;background:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:11px;color:#65706c;font-weight:700}.key:first-child{border-radius:0 0 0 8px}.key:last-child{border-radius:0 0 8px 0}.key.black{position:absolute;z-index:2;top:0;height:62%;width:8%;background:#26312f;border:1px solid #101817;border-radius:0 0 5px 5px;color:#fff;padding-bottom:7px;box-shadow:0 3px 3px #0002}.key.selected{background:#d5f0e5!important;border-color:var(--accent);color:#125e50}.key.black.selected{background:#287d72!important;color:white}
.feedback{font-size:15px;font-weight:800;text-align:center;min-height:26px;padding:7px 0 0}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{background:var(--accent);color:white;border:0;border-radius:13px;padding:12px 17px;font:inherit;font-weight:800}.secondary{background:#edf0ea;color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font:inherit;font-weight:750}
.footer{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#f2f3ed;border-radius:13px;padding:10px;text-align:center}.stat strong{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}
@media(max-width:430px){main{padding:17px 11px 25px}.card{padding:14px;border-radius:18px}.piano{height:150px;min-height:150px}.key{font-size:10px}.key.black{width:8.4%}}
</style>
</head>
<body>
<main>
 <div class="top"><div><div class="eyebrow">NOTE READING · DAILY PRACTICE</div><h1 class="title">五线谱练习室</h1></div><span class="pill" id="modeTag">高音谱号</span></div>
 <p class="sub">看音符 · 找琴键 · 练出你的读谱直觉</p>
 <section class="card">
  <div class="row"><span class="label" id="roundLabel">第 1 题 · 找出对应琴键</span><span class="score">得分 <span id="score">0</span></span></div>
  <div class="staffwrap"><svg id="staff" class="staff" viewBox="0 0 340 180" role="img" aria-label="五线谱音符"></svg></div>
  <div class="prompt" id="question">这个音符对应哪个琴键？</div><div class="hint" id="rangeHint">范围：中央 C 到高音 C</div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="row" style="margin-top:8px"><button class="secondary" id="hearBtn">♫ 播放参考音</button><button class="primary" id="nextBtn">下一题 →</button></div>
 </section>
 <section class="card">
  <div class="row"><strong>选择琴键</strong><span class="label">点击下方键盘作答</span></div>
  <div class="piano" id="piano" aria-label="钢琴键盘"></div>
  <div class="row" style="margin-top:14px"><span class="label">练习范围</span><div class="controls"><button class="control active" data-range="treble">高音谱号</button><button class="control" data-range="bass">低音谱号</button><button class="control" data-range="both">混合练习</button></div></div>
  <div class="row" style="margin-top:12px"><span class="label">显示提示</span><div class="controls"><button class="control active" id="letterToggle">显示音名</button><button class="control" id="staffToggle">辅助线：开</button></div></div>
 </section>
 <section class="card">
  <div class="row"><strong>练习统计</strong><button class="secondary" id="resetBtn">重新开始</button></div>
  <div class="stats"><div class="stat"><strong id="total">0</strong><span>已答题</span></div><div class="stat"><strong id="accuracy">—</strong><span>正确率</span></div><div class="stat"><strong id="streak">0</strong><span>连续答对</span></div></div>
 </section>
 <p class="footer">无需注册 · 打开后可练习 · 适合手机练习<br>小提示：五线谱的线和间，都是一个音级的距离。</p>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var labels=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
var naturals=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72];
var sharps=[49,51,54,56,58,61,63,66,68,70];
var range='treble',showLetters=true,ledger=true,target=60,clef='treble',score=0,total=0,correct=0,streak=0,answered=false;
var audio=null;
function name(m){return labels[m%12]+(Math.floor(m/12)-1)}
function tone(m){
 try{
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){$('feedback').textContent='当前浏览器不支持音频播放';return}
  if(!audio)audio=new AC();
  var ctx=audio;
  var start=function(){
   var o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;
   o.type='triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);
   g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.65);
   o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.68);
  };
  if(ctx.state==='suspended'){ctx.resume().then(start).catch(function(){ $('feedback').textContent='音频未启用，请在 Safari 点击播放按钮重试'; });}
  else start();
 }catch(e){$('feedback').textContent='音频播放失败，请检查 Safari 声音设置'}
}
function diatonic(m){var index=[0,-1,1,-1,2,3,-1,4,-1,5,-1,6][m%12];return (Math.floor(m/12)-5)*7+index}
function renderStaff(){
 var svg=$('staff'),ns='http://www.w3.org/2000/svg';svg.textContent='';
 function add(tag,attrs,txt){var e=document.createElementNS(ns,tag);Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k])});if(txt!==undefined)e.textContent=txt;svg.appendChild(e)}
 var bottom=clef==='treble'?112:112,base=clef==='treble'?2:-10,d=diatonic(target),y=bottom-(d-base)*10;
 for(var i=0;i<5;i++)add('line',{x1:22,y1:bottom-i*20,x2:318,y2:bottom-i*20,stroke:'#48534f','stroke-width':1.3});
 add('text',{x:29,y:96,'font-size':clef==='treble'?58:52,fill:'#287d72','font-family':'serif'},clef==='treble'?'𝄞':'𝄢');
 if(ledger){for(var low=bottom+20;low<=y;low+=20)add('line',{x1:153,y1:low,x2:187,y2:low,stroke:'#48534f','stroke-width':1.4});for(var high=bottom-100;high>=y;high-=20)add('line',{x1:153,y1:high,x2:187,y2:high,stroke:'#48534f','stroke-width':1.4})}
 add('ellipse',{cx:170,cy:y,rx:9,ry:6,fill:'#20272b',transform:'rotate(-18 170 '+y+')'});
 add('line',{x1:178,y1:y,x2:178,y2:y-38,stroke:'#20272b','stroke-width':2});
 add('text',{x:170,y:165,'font-size':17,'font-weight':800,fill:'#287d72','text-anchor':'middle'},showLetters?name(target):'？');
}
function makeKey(m,isBlack,left){var b=document.createElement('button');b.type='button';b.className=isBlack?'key black':'key';b.setAttribute('data-note',String(m));b.setAttribute('aria-label',name(m));b.textContent=showLetters?name(m):' ';if(isBlack)b.style.left=left+'%';b.addEventListener('click',function(){answer(m)});return b}
function renderPiano(){
 var p=$('piano');p.textContent='';
 naturals.forEach(function(m){p.appendChild(makeKey(m,false,0))});
 sharps.forEach(function(m){var prev=0;for(var i=0;i<naturals.length;i++)if(naturals[i]<m)prev++;var b=makeKey(m,true,(prev/15*100-4));p.appendChild(b)});
}
function pool(){if(clef==='bass')return naturals.filter(function(m){return m<=60});return naturals.filter(function(m){return m>=60})}
function choose(){clef=range==='both'?(Math.random()<.5?'treble':'bass'):range;var notes=pool();target=notes[Math.floor(Math.random()*notes.length)];answered=false;$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').textContent='跳过 / 下一题 →';$('roundLabel').textContent='第 '+(total+1)+' 题 · 找出对应琴键';$('rangeHint').textContent=clef==='treble'?'高音谱号 · 中央 C 至高音 C':'低音谱号 · 低音 C 至中央 C';renderStaff();renderPiano()}
function answer(m){tone(m);if(answered)return;answered=true;total++;var ok=m===target;if(ok){score+=10;correct++;streak++;$('feedback').textContent='答对了！+10 分';$('feedback').className='feedback good'}else{streak=0;$('feedback').textContent='正确答案是 '+name(target);$('feedback').className='feedback bad'}
 Array.prototype.forEach.call(document.querySelectorAll('.key'),function(k){if(Number(k.getAttribute('data-note'))===target)k.classList.add('selected')});$('score').textContent=score;$('total').textContent=total;$('accuracy').textContent=Math.round(correct/total*100)+'%';$('streak').textContent=streak;$('nextBtn').textContent='下一题 →';}
$('nextBtn').addEventListener('click',choose);$('hearBtn').addEventListener('click',function(){tone(target)});
Array.prototype.forEach.call(document.querySelectorAll('[data-range]'),function(b){b.addEventListener('click',function(){range=b.getAttribute('data-range');Array.prototype.forEach.call(document.querySelectorAll('[data-range]'),function(x){x.classList.toggle('active',x===b)});$('modeTag').textContent=range==='both'?'混合练习':range==='bass'?'低音谱号':'高音谱号';choose()})});
$('letterToggle').addEventListener('click',function(){showLetters=!showLetters;this.textContent=showLetters?'显示音名':'隐藏音名';this.classList.toggle('active',showLetters);renderStaff();renderPiano()});
$('staffToggle').addEventListener('click',function(){ledger=!ledger;this.textContent='辅助线：'+(ledger?'开':'关');this.classList.toggle('active',ledger);renderStaff()});
$('resetBtn').addEventListener('click',function(){score=total=correct=streak=0;$('score').textContent='0';$('total').textContent='0';$('accuracy').textContent='—';$('streak').textContent='0';choose()});
renderPiano();choose();
})();
</script>
</body></html>
